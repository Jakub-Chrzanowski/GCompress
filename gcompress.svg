<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3d2b8c"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ff"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- film/video frame being compressed -->
  <rect x="34" y="38" width="60" height="52" rx="8" fill="url(#frame)" opacity="0.95"/>
  <circle cx="64" cy="64" r="10" fill="#5b3df0"/>
  <path d="M60 58 L72 64 L60 70 Z" fill="#ffffff"/>

  <!-- inward compression arrows (left) -->
  <path d="M18 64 L30 56 L30 72 Z" fill="#ffffff"/>
  <rect x="10" y="61" width="12" height="6" rx="3" fill="#ffffff"/>

  <!-- inward compression arrows (right) -->
  <path d="M110 64 L98 56 L98 72 Z" fill="#ffffff"/>
  <rect x="106" y="61" width="12" height="6" rx="3" fill="#ffffff"/>
</svg>
